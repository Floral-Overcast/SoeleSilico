# minimal tmux config for hub terminal sessions - the claude TUI wants the whole viewport.
set -g status off
set -g mouse on
set -g history-limit 20000
set -g escape-time 10
set -g focus-events on
setw -g aggressive-resize on
# never self-destroy a session just because no client is attached: that is the whole point
# (close the phone app -> detach -> the claude TUI keeps running -> reattach later).
set -g destroy-unattached off
set -g default-terminal "tmux-256color"
# 1 line per wheel event (tmux default is 5): the hub touch handler emits one wheel
# event per text row dragged, so 1:1 tracks the finger instead of jumping 5x.
bind -T copy-mode WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down
# no mouse-drag selection: a phantom drag (browsers synthesize mouse events around
# touch) would end in copy-pipe-and-cancel = snap back to the bottom mid-scrollback.
# Selection on the hub client is xterm-local; scroll position must never be at stake.
unbind -T copy-mode MouseDrag1Pane
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDrag1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T root MouseDrag1Pane
