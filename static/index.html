<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Soele</title>

<script>try{if(localStorage.getItem("hubLight")==="1")document.documentElement.classList.add("light");}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #101014; --side: #101014; --panel: #17171d; --line: #40404c; --fg: #d8d8de;
    --rowline: #545462;   /* sidebar row divider: brighter than --line so rows read as separate */
    --dim: #d8d8de; --acc: #FFC04B; --ok: #6faf7a; --warn: #e0b83c; --err: #c96a6a; --tool: #8a93c4;
    --me: #1c2740; --me-line: #35538c;
    --yellow: #FFC04B;
    --ts: #9aa2d6;   /* message timestamp / date separator: de-emphasized via hue (cool blue-gray), not just low contrast */
  }
  /* light mode: --bg (main) + --side (sidebar) are the anchors; the rest is
     derived for readable dark-on-light. Terminal (#term/xterm) stays dark by design. */
  html.light {
    --bg: #ECE7DB; --side: #D8E0D8; --panel: #F5F1E8; --line: #cfc7b6; --fg: #22201c;
    --rowline: #b7ad97;   /* sidebar row divider: darker than --line so rows read as separate */
    --dim: #22201c; --acc: #2f6fd0; --ok: #23623a; --warn: #b58a1e; --err: #983030; --tool: #3a4184;
    --me: #dbe5f5; --me-line: #6f8fc8;
    --yellow: #d09000;
    --ts: #5a6099;   /* message timestamp / date separator: de-emphasized via hue (cool blue-gray), not just low contrast */
  }
  html.light #inputwrap:focus-within { border-color: #c8bfa8; }
  html.light #attach:hover { background: #e6e0d1; }
  html.light #modeBtn { color: #33487e; }
  * { box-sizing: border-box; margin: 0; }
  /* touch-action intersects down the ancestor chain, so pan-x/pan-y here kills pinch-zoom
     and double-tap-zoom for every touch on the page. Firefox (which hosts the TWA when it
     is the default browser) ignores user-scalable=no in the viewport meta - this it obeys. */
  html, body { touch-action: pan-x pan-y; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 "Inter", system-ui, "Segoe UI", sans-serif; height: 100vh; height: 100dvh; display: flex; overflow: hidden; overscroll-behavior: none; }
  #side { width: 330px; min-width: 250px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: relative; }
  #side { font-weight: 500; }
  #side header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 5px; }
  #side header b { color: var(--acc); font-size: 15px; letter-spacing: .5px; }
  /* wordmark: b&w "Soele" with topographic contour rings around the letterforms
     (paired strokes: ink ring then a --side gap stroke that erases its inside edge;
     rings fade with distance). White-on-dark, near-black-on-light; never --acc. */
  /* wordmark: a textured "soele" PNG (black glyphs, white flow-lines inside,
     transparent outside). Dark mode inverts it -> white glyphs, dark lines. B&W only. */
  #wordmark { flex: none; height: 20px; width: auto; filter: invert(1); }
  html.light #wordmark { filter: none; }
  #side header span { color: var(--dim); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* keep every header control on one line: never shrink or wrap ("+ new" was breaking to two lines) */
  #side header button { flex: none; white-space: nowrap; padding: 6px 10px; }
  #side header button:first-of-type { margin-left: auto; }
  /* icon-only header controls: one uniform square so the ⌘ / theme / grid buttons all match */
  #aliasbtn, #themebtn, #gridbtn, #sweepbtn, #archbtn, #newbtn { width: 30px; height: 30px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; }
  #newbtn { font-size: 22px; font-weight: 400; }   /* single "+" glyph, sized to read as an action */
  #aliasbtn svg, #themebtn svg, #gridbtn svg, #sweepbtn svg, #archbtn svg { width: 16px; height: 16px; display: block; }
  #themebtn svg { width: 11px; height: 11px; }   /* the sun reads larger than the glyph siblings - shrink to match */
  /* red dot on the sweep icon = a sweep you have not opened yet */
  #sweepbtn { position: relative; }
  #sweepbtn.hasnew::after { content: ""; position: absolute; top: 1px; right: 1px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--err); border: 1.5px solid var(--side); }
  #enginetabs { display: flex; border-bottom: 1px solid var(--line); padding: 5px 8px; gap: 4px; background: var(--side); }
  .tabbtn { flex: 1; padding: 4px; border: 1px solid transparent; border-radius: 4px; background: none; color: var(--dim); cursor: pointer; text-align: center; font-size: 11.5px; font-weight: 500; }
  .tabbtn:hover { color: var(--fg); }
  .tabbtn.active { background: var(--panel); border-color: var(--line); color: var(--acc); }
  #usage { border-bottom: 1px solid var(--line); padding: 10px; }
  #usage .hu-show { width: 100%; background: none; border: none; padding: 2px 4px; text-align: left;
    color: var(--dim); font-size: 12.5px; cursor: pointer; }
  #usage .hu-show:hover { color: var(--acc); }
  #usage .hu-pop { margin-top: 8px; }
  #usage .usage-section + .usage-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  #usage .usage-service { color: var(--txt); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  #ctbar { border-bottom: 1px solid var(--line); padding: 8px 14px; font-size: 12px; display: none; }
  #ctbar .lib-show { width: 100%; background: none; border: none; padding: 2px 4px; text-align: left;
    color: var(--dim); font-size: 12px; letter-spacing: .04em; cursor: pointer; }
  #ctbar .lib-show:hover { color: var(--acc); }
  #ctbar .lib-show .run { color: var(--ok); }
  #swatch { position: fixed; z-index: 30; display: flex; gap: 5px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #swatch button { width: 20px; height: 20px; padding: 0; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #swatch button.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
  #list { overflow-y: auto; flex: 1; }
  .sess { position: relative; overflow: hidden; border-bottom: 1px solid var(--rowline); }
  /* .swrow is the visible surface; it slides horizontally on a touch-swipe to reveal the
     action underlay (.swbg) behind it. Opaque background hides that underlay at rest. */
  .swrow { position: relative; display: flex; align-items: flex-start; gap: 9px;
    padding: 10px 14px; background: var(--side); cursor: pointer; touch-action: pan-y;
    transition: transform .2s ease; }
  .sess.dragging .swrow { transition: none; }
  .sess:hover .swrow { background: var(--panel); }
  .sess.active .swrow { background: var(--panel); border-left: 2px solid var(--acc); padding-left: 12px; }
  .sess.sel .swrow { background: var(--me); }
  /* swipe action underlay: swipe RIGHT reveals Delete (left edge), swipe LEFT reveals
     Archive (right edge). The tint follows the active direction. */
  .swbg { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: space-between; padding: 0 18px; font-size: 12.5px; font-weight: 500; }
  .swbg .swd { color: var(--err); }
  .swbg .swa { color: var(--acc); margin-left: auto; }
  .sess.sw-right .swbg { background: rgba(201,106,106,.18); }
  .sess.sw-left  .swbg { background: rgba(217,120,72,.16); }
  .sess .body { flex: 1; min-width: 0; }
  .sess .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* inline rename: the title span becomes this input in place */
  .sess .trename { display: block; width: 100%; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--acc); border-radius: 4px; padding: 1px 5px; margin: -2px 0; outline: none; }
  /* per-row pin: faint grey on the right of every row, full-colour 📌 once pinned */
  .sess .pinbtn { flex: none; border: none; background: none; padding: 0 2px; margin-top: 1px;
    font-size: 13px; line-height: 1; cursor: pointer; opacity: .72; filter: grayscale(1); }
  .sess:hover .pinbtn { opacity: 1; }
  .sess .pinbtn:hover { opacity: 1; filter: none; }
  .sess.pinned .pinbtn { opacity: 1; filter: none; }
  .sess .m { color: var(--dim); font-size: 11.5px; display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  /* sidebar row dot. YELLOW + pulse = a live turn working (the airplane is on its way back).
     GREEN steady = an idle session touched within 12h, waiting for your next prompt. Older
     idle sessions get no dot. .run (running now) and .fresh (mtime <12h) are set at row build;
     .run is listed last so a running-and-fresh session reads yellow, not green. */
  .sess .rdot { display: none; flex: none; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: var(--ok); }
  .sess.fresh .rdot { display: block; }
  .sess.run .rdot { display: block; background: var(--warn); animation: pulse 1.5s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(224,184,60,.55); } 70% { box-shadow: 0 0 0 5px rgba(224,184,60,0); } 100% { box-shadow: 0 0 0 0 rgba(224,184,60,0); } }
  /* desktop drag-reorder: the dragged row fades, a bar marks the drop slot */
  .sess.rowdragging .swrow { opacity: .4; }
  .sess.drop-before::before, .sess.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--acc); z-index: 3; }
  .sess.drop-before::before { top: 0; }
  .sess.drop-after::after { bottom: 0; }
  /* archive / trash drop targets, bottom-right of the list drawer; shown only while dragging a row */
  #dropzone { display: none; position: absolute; right: 12px; bottom: 12px; z-index: 4; gap: 8px; }
  body.listdrag #dropzone { display: flex; }
  #dropzone .dz { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(0,0,0,.4); transition: transform .1s ease; }
  #dropzone .dz.arch.over { border-color: var(--acc); background: rgba(217,120,72,.24); transform: scale(1.08); }
  #dropzone .dz.del.over  { border-color: var(--err); background: rgba(201,106,106,.26); transform: scale(1.08); }
  #dropzone .dz.stash.over { border-color: var(--dim); background: rgba(140,140,140,.22); transform: scale(1.08); }
  /* stash drawer: a sticky footer row in the list; expanding grows the group upward above it */
  #stashhead { display: flex; align-items: center; gap: 7px; padding: 9px 14px; cursor: pointer;
    color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    border-top: 1px solid var(--line); background: var(--side); position: sticky; bottom: 0; z-index: 2; }
  #stashhead:hover { color: var(--fg); }
  #stashhead .chev { font-size: 9px; transition: transform .15s ease; }
  #stashhead.open .chev { transform: rotate(90deg); }
  .sess.stashed .swrow { opacity: .68; }
  .sess.stashed .pinbtn { filter: none; }
  .badge { color: var(--acc); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; font-size: 10.5px; line-height: normal; white-space: nowrap; display: inline-flex; align-items: center; }
  /* engine/model tag: which service (Claude vs Antigravity) + model this chat runs. Shown
     in sidebar rows, grid pane heads, and the chat top bar so it always reads at a glance. */
  .eng { white-space: nowrap; font-weight: 600; }
  .phead .eng { flex-shrink: 0; }
  #engine { border: 1px solid var(--line); border-radius: 5px; padding: 0 9px; font-size: 11.5px;
    font-weight: 600; cursor: pointer; background: var(--panel); gap: 5px; }
  #engine:hover { border-color: var(--acc); }
  #engine .car { color: var(--dim); font-weight: 400; }
  #modelmenu { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4); padding: 5px; min-width: 150px;
    max-height: 70vh; overflow-y: auto; }
  #modelmenu .mi { display: block; width: 100%; text-align: left; border: none; background: none;
    padding: 7px 10px; border-radius: 5px; font-size: 12.5px; color: var(--fg); cursor: pointer; }
  #modelmenu .mi:hover { background: var(--me); }
  #modelmenu .mi.on { color: var(--acc); }
  #modelmenu .sep { border-top: 1px solid var(--line); margin: 4px 2px; }
  #modelmenu .hd { padding: 4px 10px 2px; font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #top { padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12.5px; display: flex; gap: 10px; align-items: center; min-height: 41px; }
  #top .cwd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  /* every control in the header is the same-height rectangle (buttons, the node badge) */
  #top button, #top .badge { height: 30px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  #top button svg { display: block; }
  /* explicit line-height, NOT `normal`: Inter's ascent (1984) dwarfs its descent (494), so
     `normal` yields a taller, baseline-low line box in Firefox than Chrome and the glyphs float
     up in the pill. A fixed line-height makes the flex-centered glyph box land the same in both. */
  #top .badge { line-height: 1; }
  #chat { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 18px 20px; min-height: 0; }
  .ev { max-width: 860px; margin: 0 auto 10px; }
  .me { background: var(--me); border: 1px solid var(--me-line); border-radius: 8px; padding: 8px 12px; white-space: pre-wrap; }
  .me.pending { opacity: .5; }
  .as { white-space: pre-wrap; padding: 0 2px; }
  .dim { color: var(--dim); font-size: 12px; font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .tool { color: var(--tool); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .err { color: var(--err); font-size: 12.5px; }
  .res { color: var(--ok); font-size: 12px; }
  /* per-message local-time stamp, shown under the bubble/text; hover for full date+time */
  .evts { display: block; font-size: 10.5px; color: var(--ts); margin-top: 3px; cursor: default; }
  .me .evts { text-align: right; }
  .as .evts { text-align: left; }
  /* date separator between messages sent on different local days */
  .datesep { max-width: 860px; margin: 14px auto; text-align: center; font-size: 11px;
    color: var(--ts); text-transform: uppercase; letter-spacing: .05em; }
  #composer { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  /* input row: the pill + the send circle, kept together and centered as a group so send
     always sits right beside the field (not shoved to the far edge on a wide screen) */
  #inrow { flex-basis: 100%; max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  /* the message field is one rounded pill holding the + attach button and the textarea */
  #inputwrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: 3px 4px 3px 5px; }
  #inputwrap:focus-within { border-color: #3a3a46; }
  /* symmetric padding + min-height == one line box (14px * 1.5 + 2*13) keeps a single line
     of text vertically centered; extra lines grow the field evenly from that center. */
  textarea { flex: 1; background: none; color: var(--fg); border: none; padding: 13px 8px; font: inherit;
    line-height: 1.5; resize: none; min-height: 47px; max-height: 180px; outline: none; }
  /* no visible scrollbar in the composer (still scrolls past max-height on long messages) */
  #input { scrollbar-width: none; }
  #input::-webkit-scrollbar { display: none; }
  #attach { flex: none; width: 38px; height: 38px; padding: 0; border: none; background: none;
    border-radius: 50%; color: var(--dim); font-size: 21px; line-height: 1; align-self: center;
    display: flex; align-items: center; justify-content: center; }
  #attach svg { display: block; }
  #attach:hover { color: var(--acc); background: #1e1e26; }
  /* send / stop are bare glyphs (no filled disc): a gold airplane, then a gold square
     while a turn runs. Only the queue state (typing mid-turn) keeps its filled pill. */
  #send { flex: none; width: 42px; height: 42px; padding: 0; border-radius: 50%; align-self: center;
    display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1;
    background: none; border-color: transparent; color: var(--acc); }
  #send svg { display: block; }
  #send:hover { background: none; border-color: transparent; color: #ffce70; }
  html.light #send:hover, html.light #send.stop:hover { color: #1f56b0; }
  button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
  button:hover { border-color: var(--acc); color: var(--acc); }
  button:disabled { opacity: .4; cursor: default; }
  #stop { display: none; border-color: var(--err); color: var(--err); width: 34px; padding: 0; }
  .danger:hover { border-color: var(--err); color: var(--err); }
  #empty { color: var(--dim); margin: auto; text-align: center; }
  /* terminal mode: the real interactive claude TUI, streamed from a tmux-backed pty */
  #term { flex: 1; min-height: 0; display: none; background: #0b0b0f; padding: 4px 4px 0; touch-action: none; }
  #term .xterm { height: 100%; padding: 2px 4px; }
  #keybar { display: none; gap: 6px; padding: 7px 8px; border-top: 1px solid var(--line);
    overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  #keybar button { padding: 8px 11px; font-size: 13px; flex: 0 0 auto; min-width: 40px; }
  #keybar button.on { border-color: var(--acc); color: var(--acc); background: #2a2114; }
  /* mode toggle: both view icons in one pill, the CURRENT view highlighted, click switches */
  #modeBtn { border-color: var(--me-line); color: #8fb0ee; padding: 0 3px; gap: 2px; }
  #modeBtn .mseg { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 4px; color: var(--dim); }
  #modeBtn .mseg.on { color: #eaf0fb; background: var(--me-line); }
  html.light #modeBtn .mseg.on { color: #fff; }
  #spin { display: none; color: var(--acc); font-size: 12px; }
  #ctx { font-size: 11.5px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  #drawer { display: none; }   /* desktop: controls live in #top; the drawer is mobile-only */
  #send.queue { background: var(--me-line); border-color: var(--me-line); color: #eaf0fb; }
  #send.queue:hover { background: #3f61a3; border-color: #3f61a3; color: #eaf0fb; }
  #send.stop { background: none; border-color: transparent; color: var(--acc); }
  #send.stop:hover { background: none; border-color: transparent; color: #ffce70; }
  #queuebar { flex-basis: 100%; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px;
    font-size: 12px; color: var(--dim); }
  #queuebar .qrow { display: flex; align-items: flex-start; gap: 8px; min-width: 0; max-width: 100%;
    background: var(--me); border: 1px solid var(--me-line); border-radius: 6px; padding: 5px 10px; }
  #queuebar .qhint { flex-shrink: 0; opacity: .7; }
  /* wrap up to 3 lines then clamp; overflow-wrap:anywhere so an unbroken string (URL,
     path) can never widen the row and push the ✕ off-screen */
  #queuebar .qtext { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere;
    overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  #queuebar button { padding: 1px 7px; font-size: 12px; flex-shrink: 0; }
  #attachbar { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #attachbar .chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg);
    background: var(--me); border: 1px solid var(--me-line); border-radius: 6px; padding: 3px 4px 3px 9px; }
  #attachbar .chip.up { opacity: .5; }
  #attachbar .chip button { border: none; background: none; padding: 0 4px; font-size: 13px; color: var(--dim); cursor: pointer; }
  #attachbar .chip button:hover { color: var(--err); }
  #waitbar { display: none; flex-wrap: wrap; gap: 6px; padding: 6px 16px; border-bottom: 1px solid var(--line); }
  #waitbar .chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg);
    background: var(--me); border: 1px solid var(--me-line); border-radius: 6px; padding: 3px 4px 3px 9px; }
  #waitbar .chip button { border: none; background: none; padding: 0 4px; font-size: 13px; color: var(--dim); cursor: pointer; }
  #waitbar .chip button:hover { color: var(--err); }
  #modal, #tmodal, #aliasbox, #sweepbox, #archivedbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 5; overflow-y: auto; }
  #modal .box, #tmodal .box, #aliasbox .box, #sweepbox .box, #archivedbox .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-width: 420px; margin: 12vh auto; max-height: 82vh; overflow-y: auto; padding: 18px; }
  #modal h3, #tmodal h3, #aliasbox h3, #sweepbox h3, #archivedbox h3 { font-size: 14px; margin-bottom: 12px; color: var(--fg); }
  /* sweep modal: the reviewer's per-chat gists + archive/delete suggestions, expandable, approve-only */
  #sweepbox .box { max-width: 560px; }

  /* grid mode (desktop): up to 6 chats side by side. Each cell is an iframe running this

  /* drag a pane by its title strip onto another pane to swap the two.

  body.griddrag .pane iframe { pointer-events: none; }
  .pane.dropt { outline: 2px solid var(--acc); outline-offset: -2px; }
  .pane.changed { outline: 2px solid var(--yellow); outline-offset: -2px; }

  .only-mobile { display: none; }

  #top #menu { display: none; }

    body.nav-open #backdrop { display: block; }
    #chat { padding: 14px 12px; }

    #composer { padding: 10px 12px; }

    #attach { width: 42px; height: 42px; font-size: 23px; }

    /* the drawer: an always-visible horizontal strip of the top-bar controls, sitting just

    #drawer { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center;

      border-top: 1px solid var(--line); background: var(--bg); }
    #drawer:empty { display: none; }   /* no chat open / controls elsewhere: no empty strip */
    #keybar, #composer { order: 2; }   /* the input bar sits below the drawer strip */

<script>
let hubNode = "gateway", libNode = null;   // placeholder until /api/node answers
let defNode = null;   // HUB_DEFAULT_NODE from /api/node: where fresh chats land (falls back to hubNode)
// the gateway's declared default only counts once we can actually route to it
function defaultTarget() { return (defNode && (defNode === hubNode || defNode in peerInfo)) ? defNode : hubNode; }
let codexNodes = new Set();     // nodes whose daemon found a codex binary (/api/node .codex)
let peerInfo = {};              // peer name -> its /api/node answer ({node, cts}); classifies library vs plain nodes
let nodeLabels = {};            // routing node name -> friendly display label (HUB_LABEL); routing still uses the real name
// The node name shown to the user. Routing keys stay the real node (soele/library/...);
// this only prettifies the badge/target/sidebar so the container name never leaks into the UI.
function dispNode(node) { return nodeLabels[node] || node; }
let sessions = [], cts = [];
let deletedIds = new Set();     // locally deleted/archived - stay hidden until the server list drops them
let pinned = new Set();         // pinned sids - synced via the gateway origin's /api/pins so every device agrees
// localStorage is a first-paint CACHE only (instant, offline-friendly); the server set wins on load + refresh.
try { pinned = new Set(JSON.parse(localStorage.getItem("hubPinned") || "[]")); } catch (e) {}
function cachePins() { try { localStorage.setItem("hubPinned", JSON.stringify([...pinned])); } catch (e) {} }
// Pull the shared pin set and repaint if it changed (called on load + each refresh).
async function syncPins() {
  try {
    const ids = (await (await fetch("/api/pins")).json()).ids || [];
    const next = new Set(ids);
    if (next.size !== pinned.size || [...next].some(id => !pinned.has(id))) {
      pinned = next; cachePins(); renderList();
    } else { pinned = next; cachePins(); }
  } catch (e) {}
}
// Stash: the "side folder". Stashed chats leave the main list and fold into a collapsed
// drawer at the bottom of the sidebar - out of the way, not gone. Nothing moves on disk;
// this is purely a sidebar grouping, synced across devices exactly like pins.
let stashed = new Set();
try { stashed = new Set(JSON.parse(localStorage.getItem("hubStash") || "[]")); } catch (e) {}
function cacheStash() { try { localStorage.setItem("hubStash", JSON.stringify([...stashed])); } catch (e) {} }
async function syncStash() {
  try {
    const ids = (await (await fetch("/api/stash")).json()).ids || [];
    const next = new Set(ids);
    if (next.size !== stashed.size || [...next].some(id => !stashed.has(id))) {
      stashed = next; cacheStash(); renderList();
    } else { stashed = next; cacheStash(); }
  } catch (e) {}
}
// Custom titles: per-chat rename. {sid: title} overlaid on the derived title at render time,
// synced across devices via the origin store exactly like pins. Empty = no override.
let titles = {};
try { titles = JSON.parse(localStorage.getItem("hubTitles") || "{}") || {}; } catch (e) {}
function cacheTitles() { try { localStorage.setItem("hubTitles", JSON.stringify(titles)); } catch (e) {} }
function dispTitle(s) { return (s && titles[s.id]) || (s && s.title) || ""; }
async function syncTitles() {

// Reliability: we do NOT gate on a boolean (a background renderList that removed the focused

// flag `true` and block every future rename until a page reload). Instead "already editing" is
// read from the DOM, and renderList() defers while an input is live (see its guard).
function startRename(s, tEl) {
  if (document.querySelector("#list .trename")) return;   // one at a time, derived from the DOM
  const inp = document.createElement("input");
  inp.className = "trename";
  inp.value = dispTitle(s);
  tEl.replaceWith(inp);
  inp.focus(); inp.select();
  let done = false;
  const finish = (save) => {
    if (done) return; done = true;
    if (save) {
      const v = inp.value.trim();
      const cur2 = titles[s.id] || "";
      if (v === (s.title || "")) { delete titles[s.id]; }   // matches derived title -> no override
      else if (v) { titles[s.id] = v; }
      else { delete titles[s.id]; }                          // blank -> clear override
      if ((titles[s.id] || "") !== cur2) {
        cacheTitles();
        const has = !!titles[s.id];
        fetch("/api/titles/" + encodeURIComponent(s.id),
          has ? { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: titles[s.id] }) }
              : { method: "DELETE" }).catch(() => {});
      }
    }
    inp.remove();          // drop the input FIRST so renderList's edit-guard lets the repaint through
    renderList();
    if (gridOn) gridTitles();
  };
  inp.onclick = e => e.stopPropagation();
  inp.onkeydown = e => {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); finish(false); }
  };
  inp.onblur = () => finish(true);
}

// single-row archive/delete (used by the swipe gesture + review modal). Delete asks first;
// archive doesn't. Drop the row optimistically, then fire the routed call.
function rowAction(id, kind) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  if (kind === "delete" && !confirm("delete this chat? this cannot be undone")) return;
  dropSession(id);
  if (cur && cur.id === id) freshBlank();   // closing the open chat lands on a usable fresh blank
  const url = apiBase(s.node) + `/api/sessions/${id}` + (kind === "archive" ? "/archive" : "");
  fetch(url, { method: kind === "archive" ? "POST" : "DELETE" }).catch(() => {});
}

// Touch gestures on chat rows (delegated on #list so re-renders don't need re-binding):
//   swipe RIGHT -> delete (modal confirm)   swipe LEFT -> archive (no confirm)
// A tap still opens; the swipeConsumedAt guard stops a swipe from also opening the chat.
// Multi-select is the header `select` button (touch) or shift/ctrl-click (desktop). The old
// click-and-hold-to-select gesture (touch long-press + desktop mouse-hold) was removed once
// drag-reorder landed - a hold now reads as the start of a drag, not a select.
function initRowGestures() {
  const list = $("list");
  let row = null, swrow = null, sid = null;
  let startX = 0, startY = 0, dx = 0, dir = 0, w = 0;

  const reset = () => {
    if (row) { row.classList.remove("dragging", "sw-left", "sw-right"); if (swrow) swrow.style.transform = ""; }
    row = swrow = sid = null; dx = 0; dir = 0;
  };

  list.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    const r = e.target.closest(".sess"); if (!r) return;
    row = r; swrow = r.querySelector(".swrow"); sid = r.dataset.sid;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    dx = 0; dir = 0; w = r.offsetWidth || 300;
  }, { passive: true });

  list.addEventListener("touchmove", e => {
    if (!row || e.touches.length !== 1) return;
    const mx = e.touches[0].clientX - startX, my = e.touches[0].clientY - startY;
    if (dir === 0) {
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;      // within slop, undecided
      dir = Math.abs(mx) > Math.abs(my) ? 1 : -1;              // lock axis on first real move
      if (dir === 1) row.classList.add("dragging");
    }
    if (dir !== 1) return;                                     // vertical -> let the list scroll
    e.preventDefault();
    dx = Math.max(-w * 0.9, Math.min(w * 0.9, mx));
    swrow.style.transform = `translateX(${dx}px)`;
    row.classList.toggle("sw-right", dx > 0);
    row.classList.toggle("sw-left", dx < 0);
  }, { passive: false });

  const end = () => {
    if (!row) return;
    if (dir === 1) {                                           // horizontal drag: archive/delete, never open
      const past = Math.abs(dx) > Math.max(70, w * 0.33);
      const kind = dx > 0 ? "delete" : "archive", id = sid;
      swipeConsumedAt = Date.now();
      reset();
      if (past) rowAction(id, kind);                           // else it just snaps back
      return;
    }
    reset();
  };
  list.addEventListener("touchend", end);
  list.addEventListener("touchcancel", reset);
}

// Plan-usage panel in the sidebar. /api/usage has named Claude + Codex sections;
// only Claude gets the browser's current Claude-context row.
let usageProps = null;
const CTX_MAX = 200000;  // opus context window - drives the context bar's fill
function usageSections(props) {

  const named = ("claude" in props) || ("codex" in props);
  const sections = named ? [
    { id: "claude", name: "Claude", props: props.claude },
    { id: "codex", name: "Codex", props: props.codex },

  return sections.filter(s => s.props && (s.props.limits || []).length);

function renderUsagePanel() {
  const u = $("usage");

// position:fixed anchors to the LAYOUT viewport, so on a pinch-zoomed phone the box could

// ---- chat ----
const PAST_CLS = { user: "me", assistant: "as", tool: "tool", tool_err: "err" };

// Every (re)connect reloads the transcript from disk (the source of truth) and then
// tails from that byte offset. This makes the view restart-proof: a turn that spanned
// a daemon restart is fully on disk, so reconnecting repaints history + resumes the
// live tail with no gap and no duplicates.
async function connect(s) {
  if (sock) { sock.onclose = null; sock.close(); }
  pendingEcho = [];  // a (re)connect repaints the log from disk (truth), so drop optimistic echoes
  if (!s.fresh) {
    try {
      const r = await fetch(apiBase(s.node) + `/api/sessions/${s.id}/transcript`).then(r => r.json());
      if (cur !== s) return;  // user clicked away mid-load
      $("chat").innerHTML = "";
      for (const e of (r.events || [])) {
        if (e.role === "tokens") tokenLine(e.n);
        // timestamp shown only on real chat messages (user/assistant), not tool/status lines
        else line(PAST_CLS[e.role] || "dim", e.text, (e.role === "user" || e.role === "assistant") ? e.ts : null);
      }
      ctxTokens = r.ctx || 0; updateCtx();
      maybeSuggestCompact(s);
      if (s.engine === "codex")
        line("dim", "Codex transcript — send here or switch to term for the full interactive view.");
      s.offset = r.size || 0;
    } catch (e) { s.offset = s.offset || 0; }
  } else { s.offset = 0; }
  sock = new WebSocket(wsUrl(s));
  sock.onopen = () => { if (!s.fresh) sock.send(JSON.stringify({ type: "attach", from: s.offset, ctid: s.ctid })); };
  sock.onmessage = m => render(JSON.parse(m.data));
  sock.onclose = () => { if (cur === s) setTimeout(() => connect(s), 1200); };
}

function toggleNav() { document.body.classList.toggle("nav-open"); }

// Mobile drawer: the top-bar controls (everything but the #ctx environment badge) live in an
// always-visible horizontal strip just above the bottom bar; desktop keeps them in #top. Same
// DOM nodes, reparented on the breakpoint, so every id/handler keeps working in either home.
// The strip is a real flex row in #main (not an overlay), so #chat's scroll area sits above it
// and messages never hide behind it. It rides the keyboard for free (bottom of the vv-sized
// column). CSS `order` floats it just above whichever bar shows (composer OR terminal keybar).
// drawer order, left to right: pause, model select, view toggle, hamburger. #spin is not
// here - the pause button already signals a running turn, so the "running…" text is dropped

// highlight the open chat WITHOUT refetching the (slow) session list - clicking a chat
// only needs to load its transcript (fast), not rebuild the whole sidebar.
function setActive(id) {
  for (const d of document.querySelectorAll("#list .sess"))
    d.classList.toggle("active", d.dataset.sid === id);
}

function open(s) {
  if (gridOn && !PANE) return gridAdd(s);   // grid mode: a click fills a pane instead
  if (codexInputSession && codexInputSession !== s) closeCodexInput();
  cur = s;
  if (s.pin) s.model = s.pin;   // server-synced per-chat model pin beats the detected model
  closeNav();
  $("tcwd").textContent = s.cwd || "";
  $("ctx").textContent = s.ct ? "ct:" + s.ct : dispNode(s.node);
  updateEngineBadge();
  // an unsent "/compact" (prefilled or typed) never follows you into another chat -
  // a typed one is already draft-saved under its own session, so clearing the box is safe
  if ($("input").value.trim() === "/compact") { $("input").value = ""; updateSendBtn(); }
  loadDraft(s);   // an unsent draft for this chat survives an app kill / reload
  // the local-model row has a chat view (a direct request to the local model) plus a terminal
  // toggle for its full agentic CLI. Codex has its own persisted event log and a TUI-backed
  // composer.
  const termOnly = !!s.term_only;
  $("modeBtn").style.display = termOnly ? "none" : "inline-flex";
  updateModeBtn();
  setActive(s.id);   // highlight instantly; no full list refetch (that was the ~3s stall)
  markChatSeen(s);   // clicking a chat clears its green "waiting for you" dot

  if ((termModeFor(s) && !s.blank) || termOnly || (s.fresh && s.engine === "codex")) return openTerm(s);
  if (isLocalChat(s)) return openLocalChat(s);
  openChat(s);
}
function openChat(s) {
  showChatUI();
  turnIn = 0; turnSpent = 0;
  ctxTokens = 0; updateCtx();
  queue = []; updateQueueBar();
  if (!s.fresh) refreshQueue(s);   // pull the host-side queue for this chat (survives app close / chat switch)
  waits = []; updateWaitBar();
  if (!s.fresh) refreshWaits(s);   // pull pending soele-wait watches for this chat
  clearAttach();

async function loadLocalTranscript(s) {
  try {
    const r = await fetch(apiBase(s.node) + `/api/local/${encodeURIComponent(s.id)}/transcript`).then(r => r.json());
    if (cur !== s) return;   // user clicked away mid-load

      }

        if (b.type === "text" && b.text.trim()) line("as", b.text, ev.timestamp);
        else if (b.type === "tool_use") line("tool", toolLine(b));
      }

// Mobile keyboard: 100dvh does NOT shrink when the on-screen keyboard opens, and iOS
// leaves the page scrolled after it dismisses - that stranded scroll is the blank gap
// under the composer. Drive the body height off the visual viewport (so the composer
// tracks the keyboard) and pin window scroll to 0 (so nothing is left behind on close).
// iOS Safari ignores user-scalable=no, so block its pinch-zoom gestures directly.
["gesturestart", "gesturechange", "gestureend"].forEach(e =>
  document.addEventListener(e, ev => ev.preventDefault(), { passive: false }));
// ...and a two-finger doubletap / trackpad ctrl-wheel zoom.
document.addEventListener("wheel", ev => { if (ev.ctrlKey) ev.preventDefault(); }, { passive: false });

// PANE iframes skip this: the keyboard-tracking hack pins body to a FIXED PIXEL height
// measured at load, so a later grid reshape / window resize left the composer clipped
// off the bottom ("no send area"). Plain 100dvh tracks the iframe size natively.
const vv = window.visualViewport;
if (vv && !PANE) {
  // Only drive body height off the visual viewport at natural scale. When the user IS
  // mid-pinch (scale != 1), matching body to the grown viewport revealed more page to
  // zoom into - a runaway that let the page zoom out forever. Ignore those frames.
  const fit = () => {
    if (Math.abs(vv.scale - 1) > 0.01) return;
    document.body.style.height = vv.height + "px"; window.scrollTo(0, 0); fitTerm();
  };
  vv.addEventListener("resize", () => { fit(); placeModal(); placeAliasBox(); placeCTBox(); });
  vv.addEventListener("scroll", () => { fit(); placeModal(); placeAliasBox(); placeCTBox(); });
  fit();
}

// Installable-PWA plumbing: register the service worker so Firefox/Chrome offer
// "Install" (needs HTTPS - a secure context; silently skipped over plain http).
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

// Phone notifications (web push). The bell only appears where push can work: a secure
// context (an HTTPS origin) with PushManager support. Subscriptions are
// per-browser; the daemon pushes on every chat-turn end and the SW suppresses the
// notification while the app is visible, so ON is the sane steady state on the phone.
function pushKeyBytes(s) {
  const pad = "=".repeat((4 - s.length % 4) % 4);
  return Uint8Array.from(atob((s + pad).replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
}
async function paintNotif() {
  if (!isSecureContext || !("PushManager" in window) || !("serviceWorker" in navigator)) return;
  const btn = $("notifbtn");
  if (!btn) return;   // bell removed from the header (the ⌘ aliases box took its slot); push stays on
  btn.style.display = "";
  let sub = null;
  try { sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); } catch (e) {}
  btn.classList.toggle("on", !!sub);
  btn.title = sub ? "phone notifications: on (tap to disable)" : "phone notifications: off (tap to enable)";
}
async function toggleNotif() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const have = await reg.pushManager.getSubscription();
    if (have) {
      await fetch("/api/push/subscribe", { method: "DELETE", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ endpoint: have.endpoint }) });
      await have.unsubscribe();
    } else {
      if (await Notification.requestPermission() !== "granted") throw new Error("permission denied");
      const key = (await (await fetch("/api/push/key")).json()).key;
      if (!key) throw new Error("push not set up on the server");
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: pushKeyBytes(key) });
      const r = await fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sub.toJSON()) });
      if (!r.ok) { await sub.unsubscribe(); throw new Error("server rejected the subscription"); }
    }
  } catch (e) { alert("notifications: " + (e.message || e)); }
  paintNotif();
}
paintNotif();

async function pollSweep() {

  if (d.configured === false) {   // no reviewer LLM set on the daemon

    $("sweeprun").disabled = true;

function paintSweep(d) {
  const box = $("sweeplist");

  // an aborted sweep can still carry partial results - show the error AND the rows
  if (d.error) { const m = document.createElement("div"); m.className = "amsg"; m.textContent = d.error; box.appendChild(m); }
  // stale snapshot rows for chats that no longer exist (deleted meanwhile) are dropped
  const live = new Set(sessions.map(s => s.id));
  const rows = (d.sessions || []).filter(r => live.has(r.id) && !deletedIds.has(r.id));
  if (!rows.length) { const m = document.createElement("div"); m.className = "amsg"; m.textContent = "nothing to review"; box.appendChild(m); return; }
  const rk = { delete: 0, archive: 1, keep: 2 };
  rows.sort((a, b) => (rk[a.rec] ?? 2) - (rk[b.rec] ?? 2) || (b.mtime || 0) - (a.mtime || 0));
  for (const r of rows) {
    const div = document.createElement("div");
    div.className = "swp"; div.dataset.sid = r.id; div.dataset.rec = r.rec;
    // Checking a row acts on it. Delete rows delete; archive AND keep rows archive - so a
    // "keep" can be archived from here without leaving the modal. Archive rows come
    // pre-checked (reversible, the reviewer's own pick); keep and delete need an explicit check.
    div.dataset.act = r.rec === "delete" ? "delete" : "archive";
    const chk = `<input type="checkbox" ${r.rec === "archive" ? "checked" : ""} onclick="event.stopPropagation();updateSweepBtn()">`;
    div.innerHTML = `<div class="top">${chk}<span style="flex:1;min-width:0">`
      + `<span class="t"></span><span class="gist"></span></span>`
      + `<span class="rec ${r.rec}">${r.rec}</span></div><div class="detail"></div>`;
    div.querySelector(".t").textContent = (r.pinned ? "📌 " : "") + (r.stashed ? "📦 " : "") + (dispTitle(r) || "(untitled)");
    div.querySelector(".gist").textContent = `${r.ct ? "ct:" + r.ct : dispNode(r.node)} · ${age(r.mtime)} - ${r.gist || ""}`;
    div.querySelector(".detail").textContent = (r.detail || "(no detail)") + (r.reason ? `\n\nwhy ${r.rec}: ${r.reason}` : "");
    div.querySelector(".top").onclick = () => div.classList.toggle("x");   // expand = the reviewer's mini compact
    box.appendChild(div);
  }

}
function updateSweepBtn() {
  const c = [...document.querySelectorAll("#sweeplist .swp input:checked")];
  const nD = c.filter(x => x.closest(".swp").dataset.act === "delete").length, nA = c.length - nD;
  const b = $("sweepapply");
  b.disabled = !c.length;
  b.textContent = c.length ? `apply${nA ? ` · ${nA} archive` : ""}${nD ? ` · ${nD} delete` : ""}` : "apply";
}
async function runSweepNow() {
  $("sweeprun").disabled = true;
  try { await fetch("/api/sweep/run", { method: "POST" }); } catch (e) {}
  pollSweep();
}
function applySweep() {
  const els = [...document.querySelectorAll("#sweeplist .swp input:checked")].map(x => x.closest(".swp"));
  if (!els.length) return;
  const nD = els.filter(e => e.dataset.act === "delete").length, nA = els.length - nD;
  const parts = [];
  if (nA) parts.push(`archive ${nA}`);
  if (nD) parts.push(`delete ${nD} (cannot be undone)`);
  if (!confirm(parts.join(", ") + " - go ahead?")) return;
  const byId = new Map(sessions.map(s => [s.id, s]));
  for (const el2 of els) {
    const id = el2.dataset.sid, kind = el2.dataset.act, s = byId.get(id);
    if (!s) continue;
    dropSession(id);
    if (cur && cur.id === id) freshBlank();   // closing the open chat lands on a usable fresh blank
    fetch(apiBase(s.node) + `/api/sessions/${id}` + (kind === "archive" ? "/archive" : ""),
      { method: kind === "archive" ? "POST" : "DELETE" }).catch(() => {});
    el2.remove();
  }

function renderAliases() {

  const box = $("aliaslist"), q = ($("aliasfilter").value || "").toLowerCase().trim();
  box.innerHTML = ""; let shown = 0;
  for (const n of aliasData) {
    const items = (n.aliases || []).filter(a =>
      !q || a.name.toLowerCase().includes(q) || a.value.toLowerCase().includes(q));
    if (!items.length) continue;
    shown += items.length;

      const vl = document.createElement("span"); vl.className = "aval"; vl.textContent = a.value;

// Launch an alias on its own node. The daemon runs it detached and returns a
// short result; we flash the button and drop a one-line result under the row.
async function runAlias(node, name, btn) {
  btn.disabled = true; btn.classList.remove("ok", "err");
  const orig = btn.textContent; btn.textContent = "…";
  let res;
  try {
    res = await (await fetch(apiBase(node) + "/api/aliases/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    })).json();
  } catch (e) { res = { ok: false, out: "request failed" }; }
  btn.disabled = false; btn.textContent = orig;
  btn.classList.add(res.ok ? "ok" : "err");
  setTimeout(() => btn.classList.remove("ok", "err"), 2500);
  const row = btn.parentElement;
  let out = row.nextElementSibling;
  if (!out || !out.classList.contains("aout")) {
    out = document.createElement("div"); out.className = "aout"; row.after(out);
  }
  out.textContent = (res.launched ? "▶ " : (res.ok ? "✓ " : "✗ ")) + (res.out || (res.ok ? "done" : "failed"));
}

// ---- grid mode (desktop): up to 6 chats at once ----
// The parent lays out up to 6 iframes; each iframe is THIS page with ?pane=1 and its
// session object in the hash - a fully live chat (composer, queue, terminal mode) with
// the sidebar hidden. No daemon changes: a pane talks to the same APIs as a normal tab.
// Panes never manage the grid; they only postMessage "close me" / "my sid changed".
let paneKey = null;             // the id the PARENT knows this pane by (pre-rename for fresh chats)
let gridOn = false;
let gridSess = [];              // sessions in the grid, slot order (subset fields only)
const paneEls = new Map();      // gridSess id -> .pane element
let dragId = null;              // pane id being dragged (phead drag-to-swap)
// restore the last grid's members; unstarted fresh stubs would re-create a session, drop them.
// Entries saved before per-pane modes existed default to chat (the send box is the point).
try { gridSess = JSON.parse(localStorage.getItem("hubGrid") || "[]").filter(s => s && s.id && !s.fresh)
                     .map(s => (s.mode ? s : { ...s, mode: "chat" })); } catch (e) {}
function saveGrid() {
  try { localStorage.setItem("hubGrid", JSON.stringify(gridSess));
        localStorage.setItem("hubGridOn", gridOn ? "1" : "0"); } catch (e) {}
}
function paneSrc(s) { return "/?pane=1#s=" + encodeURIComponent(JSON.stringify(s)); }
function gridAdd(s) {
  if (gridSess.some(x => x.id === s.id)) return;                           // already showing
  if (gridSess.length >= 27) gridRemove(gridSess[gridSess.length - 1].id); // full: replace the newest slot
  gridSess.push({ id: s.id, node: s.node, ct: s.ct, ctid: s.ctid, cwd: s.cwd,
                  title: s.title, model: s.model, effort: s.effort, fresh: !!s.fresh,
                  mode: s.mode || "chat", engine: s.engine });   // panes default to chat view (composer visible)
  saveGrid(); renderGrid();
}
function gridAutofill() {
  if (PANE) return;
  let listSess = sessions.filter(s => engMatches(s, engineFilter) && !stashed.has(s.id));   // hibernated chats never autofill
  listSess.sort((a, b) => (pinned.has(b.id) ? 1 : 0) - (pinned.has(a.id) ? 1 : 0));
  
  let added = false;
  for (const s of listSess) {
    const visibleCount = gridSess.filter(x => engMatches(x, engineFilter)).length;
    if (visibleCount >= 9) break;
    if (gridSess.some(x => x.id === s.id)) continue;
    gridSess.push({ id: s.id, node: s.node, ct: s.ct, ctid: s.ctid, cwd: s.cwd,
                    title: s.title, model: s.model, effort: s.effort, fresh: !!s.fresh,
                    mode: s.mode || "chat", engine: s.engine });
    added = true;
  }
  if (added) saveGrid();
  renderGrid();
}
function gridRemove(id) {
  if (PANE) return;
  const i = gridSess.findIndex(x => x.id === id);
  if (i < 0) return;
  gridSess.splice(i, 1);
  const el = paneEls.get(id);
  if (el) { el.remove(); paneEls.delete(id); }
  saveGrid(); renderGrid();
}
function getGridDim(n) {
  // cap at 2 rows (never 3); panes fill left-to-right, top row first (row-major, see applyGridPos)
  const rows = n <= 3 ? 1 : 2;
  const cols = n === 0 ? 1 : Math.ceil(n / rows);
  return { rows, cols };
}
function renderGrid() {
  const g = $("grid"), n = gridSess.length;
  if (!n) { g.innerHTML = '<div id="gridempty">click chats in the sidebar to add them here (up to 27)</div>'; paneEls.clear(); return; }
  const e = $("gridempty"); if (e) e.remove();
  const dim = getGridDim(n);
  g.style.gridTemplateColumns = `repeat(${dim.cols}, 1fr)`;
  g.style.gridTemplateRows = `repeat(${dim.rows}, 1fr)`;
  for (const s of gridSess) {          // incremental: never touch live panes (an iframe re-append reloads it)
    if (paneEls.has(s.id)) continue;
    const d = document.createElement("div"); d.className = "pane";
    d.addEventListener("mousedown", () => { d.classList.remove("changed"); }, { passive: true });
    const h = document.createElement("div"); h.className = "phead";
    const bd = document.createElement("span"); bd.className = "badge";
    bd.textContent = s.ct ? "ct:" + s.ct : dispNode(s.node);
    const c = tagCol(colorFor(s.ct || s.node));
    bd.style.color = c; bd.style.borderColor = c + "66"; bd.style.background = c + "1e";
    const em = engineMeta(s);
    const eg = document.createElement("span"); eg.className = "eng";
    eg.textContent = em.glyph + " " + em.label; eg.style.color = em.color; eg.title = em.label;
    const t = document.createElement("span"); t.className = "pt";
    const dt = titles[s.id] || s.title;
    t.textContent = dt || (s.fresh ? "(new chat)" : "…");
    t.title = dt || "";
    const x = document.createElement("button"); x.textContent = "✕"; x.title = "close pane";
    x.onclick = () => gridRemove(s.id);   // s is the live gridSess entry: reads the CURRENT id after a fresh-chat rename
    h.append(bd, eg, t, x); d.appendChild(h);
    // drag the strip onto another pane to swap slots (drop targets = whole panes)
    h.draggable = true;
    h.addEventListener("dragstart", e => {
      dragId = s.id;
      e.dataTransfer.setData("text/plain", s.id);
      e.dataTransfer.effectAllowed = "move";
      document.body.classList.add("griddrag");
    });
    h.addEventListener("dragend", () => {
      dragId = null;
      document.body.classList.remove("griddrag");
      for (const p of paneEls.values()) p.classList.remove("dropt");
    });
    d.addEventListener("dragover", e => {
      if (!dragId || dragId === s.id) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move"; d.classList.add("dropt");
    });
    d.addEventListener("dragleave", () => d.classList.remove("dropt"));
    d.addEventListener("drop", e => { e.preventDefault(); d.classList.remove("dropt"); gridSwap(dragId, s.id); });
    const f = document.createElement("iframe"); f.src = paneSrc(s);
    d.appendChild(f); g.appendChild(d); paneEls.set(s.id, d);
  }
  applyGridPos();
  gridPaint();
}
// Panes sit at EXPLICIT row-major grid coordinates derived from gridSess order (fill the
// top row left-to-right, then the second), and a swap only rewrites those styles:
// reordering iframes in the DOM would RELOAD them.
function applyGridPos() {
  let visibleCount = 0;
  gridSess.forEach((s) => {
    const el = paneEls.get(s.id);
    if (!el) return;
    const visible = engMatches(s, engineFilter);
    el.style.display = visible ? "flex" : "none";
    if (visible) visibleCount++;
  });
  const dim = getGridDim(visibleCount);
  let idx = 0;
  gridSess.forEach((s) => {
    const el = paneEls.get(s.id);
    if (!el || el.style.display === "none") return;
    // row-major: fill the top row left-to-right, then wrap to the second row
    el.style.gridColumn = String((idx % dim.cols) + 1);
    el.style.gridRow = String(Math.floor(idx / dim.cols) + 1);
    idx++;
  });
  const g = $("grid");
  if (g) {
    g.style.gridTemplateColumns = `repeat(${dim.cols}, 1fr)`;
    g.style.gridTemplateRows = `repeat(${dim.rows}, 1fr)`;
  }
}
function gridSwap(a, b) {
  const i = gridSess.findIndex(x => x.id === a), j = gridSess.findIndex(x => x.id === b);
  if (i < 0 || j < 0 || i === j) return;
  [gridSess[i], gridSess[j]] = [gridSess[j], gridSess[i]];
  applyGridPos(); saveGrid();
}
// pane titles track the session list: a fresh chat starts untitled and Claude's ai-title
// lands later, so re-pull on every list fetch and persist the newest into hubGrid.
function gridTitles() {
  if (PANE) return;   // panes hold a stale localStorage copy of gridSess - never write it back
  let changed = false;
  for (const s of gridSess) {
    const m = sessions.find(x => x.id === s.id);
    if (!m) continue;
    if (m.title && m.title !== s.title) { s.title = m.title; changed = true; }
    if (m.engine && m.engine !== s.engine) { s.engine = m.engine; changed = true; }
    const el = paneEls.get(s.id), t = el && el.querySelector(".pt");
    if (t) { const disp = titles[s.id] || s.title; t.textContent = disp; t.title = disp; }
  }
  if (changed) saveGrid();
}
// sidebar highlight in grid mode = every session currently up in a pane
function gridPaint() {
  for (const d of document.querySelectorAll("#list .sess"))
    d.classList.toggle("active", gridOn ? gridSess.some(s => s.id === d.dataset.sid)
                                        : !!(cur && cur.id === d.dataset.sid));
}
function toggleGrid() {
  if (PANE) return;
  gridOn = !gridOn;
  document.body.classList.toggle("grid", gridOn);
  $("gridbtn").classList.toggle("on", gridOn);
  if (gridOn) {
    if (cur && !cur.fresh) gridAdd(cur);   // seed with the open chat
    // the panes are the live clients now - drop the single view's connections
    if (sock) { sock.onclose = null; sock.close(); sock = null; }
    showChatUI();                          // also closes termSock
    setRunning(false);
    clearCur("pick a chat, or + new");   // seen only after the grid closes (#main is hidden while it's on)
    
    const visibleCount = gridSess.filter(s => engMatches(s, engineFilter)).length;
    if (visibleCount === 0) gridAutofill(); else renderGrid();
  } else {
    gridPaint();
  }
  saveGrid();
}
function paneSid(newId) {          // a fresh pane learned its real session id - keep the parent's key in sync
  try { parent.postMessage({ hubPane: "sid", old: paneKey, id: newId }, location.origin); } catch (e) {}
  paneKey = newId;
}
if (!PANE) window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || !e.data.hubPane) return;
  if (e.data.hubPane === "sid") {
    const s = gridSess.find(x => x.id === e.data.old);
    if (!s) return;
    s.id = e.data.id; s.fresh = false;
    const el = paneEls.get(e.data.old);
    if (el) { paneEls.delete(e.data.old); paneEls.set(s.id, el); }
    saveGrid();
  } else if (e.data.hubPane === "mode") {   // a pane toggled chat/term - remember it for reloads
    const s = gridSess.find(x => x.id === e.data.id);
    if (s && (e.data.mode === "chat" || e.data.mode === "term")) { s.mode = e.data.mode; saveGrid(); }
  } else if (e.data.hubPane === "changed") {
    const el = paneEls.get(e.data.id);
    const iframe = el && el.querySelector("iframe");
    if (el && document.activeElement !== iframe) {
      el.classList.add("changed");
    }
  } else if (e.data.hubPane === "click") {
    const el = paneEls.get(e.data.id);
    if (el) el.classList.remove("changed");
  }
});

if (PANE) {
  // one grid cell: resolve the node name (ws routing compares against hubNode), then open
  // the session handed over in the hash. No list/CT/usage polling - the parent does that.
  let ps = null;
  try { ps = JSON.parse(decodeURIComponent(location.hash.slice(3))); } catch (e) {}
  paneKey = ps && ps.id;
  if (ps) {
    if (ps.engine === "codex") codexTermMode = ps.mode === "term";
    else termMode = ps.mode === "term";   // per-pane view, not the shared hubTerm default
  }
  (async () => {
    try { hubNode = (await (await fetch("/api/node")).json()).node; } catch (e) {}
    if (ps) open(ps); else $("chat").innerHTML = '<div id="empty">bad pane target</div>';
  })();
  const clearOutline = () => {
    try { parent.postMessage({ hubPane: "click", id: paneKey }, location.origin); } catch (e) {}
  };
  window.addEventListener("mousedown", clearOutline, { passive: true });
  window.addEventListener("touchstart", clearOutline, { passive: true });
} else {
  initRowGestures();
  initRowDrag();
  updateEngineTabs();
  layoutControls();   // seat the top-bar controls in #top or the mobile drawer per viewport
  refresh().then(() => {
    // cold-start from a notification tap: the SW opened "/#sid=<sid>"
    const m = location.hash.match(/^#sid=([0-9a-fA-F-]+)$/);
    if (m) { history.replaceState(null, "", "/"); openBySid(m[1]); }
    else freshBlank();   // no deep-link: open a ready-to-type blank instead of a dead screen (grid restore below no-ops it)
  });
  syncPins(); syncStash(); syncOrder(); syncTitles(); refreshCTs(); refreshUsage(); refreshRunning(); refreshSweepBadge();
  setInterval(() => { refresh(); syncPins(); syncStash(); syncOrder(); syncTitles(); }, 45000);
  setInterval(refreshCTs, 60000);
  setInterval(refreshUsage, 12000);
  setInterval(refreshRunning, 3500);
  setInterval(refreshSweepBadge, 120000);   // slow: sweeps are a few hours apart
  // restore a grid that was left open (desktop only)
  if (localStorage.getItem("hubGridOn") === "1" && innerWidth > 700 && gridSess.length) toggleGrid();
}
</script>
</body>
</html>
